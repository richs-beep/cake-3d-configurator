function duplicateDecor() {
    if(ui.selTier===null) return;
    const tier = getActiveTiers()[ui.selTier];

    // Кого копируем?
    let indicesToCopy = [];
    if (isMultiSelect && selectedDecors.length > 0) {
        indicesToCopy = [...selectedDecors]; // Копия массива индексов
        selectedDecors = []; // Сбрасываем выбор, чтобы выделить НОВЫЕ копии
    } else if (ui.selDecorIdx !== null) {
        indicesToCopy = [ui.selDecorIdx];
    } else {
        return;
    }

    const newIndices = [];
    
    indicesToCopy.forEach(idx => {
        const src = tier.decor[idx];
        const copy = JSON.parse(JSON.stringify(src));
        
        // Сдвигаем копию
        if (copy.placement === 'side') {
            copy.x = (copy.x || 0) + 0.05;
        } else {
            copy.x = (copy.x || 0) + 20; 
            copy.z = (copy.z || 0) + 20;
        }
        
        tier.decor.push(copy);
        newIndices.push(tier.decor.length - 1);
    });

    // Если был мульти-режим, выделяем новые копии
    if (isMultiSelect) {
        selectedDecors = newIndices;
    } else {
        ui.selDecorIdx = newIndices[0];
    }

    rebuildScene();
    openMenu('decor');
    recordHistory();
}

// 2. Отправить в другой торт (ФИНАЛЬНАЯ ВЕРСИЯ - БЕЗ ЛИШНЕЙ ПОДСВЕТКИ)
function copyDecorToOther() {
    if(ui.selTier===null || ui.selDecorIdx===null) return;
    
    // 1. Определяем цель
    const targetId = (activeCakeId === 0) ? 1 : 0;
    
    // 2. Проверка данных
    if(typeof cakes === 'undefined' || !cakes[targetId]) {
        console.error("Ошибка: cakes не найден"); return;
    }
    const targetTiers = cakes[targetId].tiers || cakes[targetId];
    if(!targetTiers || targetTiers.length === 0) {
        alert("Второй торт пустой! Добавьте ярус."); return;
    }

    // 3. Копируем данные
    const srcTier = getActiveTiers()[ui.selTier];
    const srcDecor = srcTier.decor[ui.selDecorIdx];
    const copy = JSON.parse(JSON.stringify(srcDecor));

    // Выбираем ярус на новом торте
    let targetTierIdx = ui.selTier;
    if (targetTierIdx >= targetTiers.length) targetTierIdx = targetTiers.length - 1;
    
    if (!targetTiers[targetTierIdx].decor) targetTiers[targetTierIdx].decor = [];
    
    // Добавляем в массив
    targetTiers[targetTierIdx].decor.push(copy);
    const newDecorIdx = targetTiers[targetTierIdx].decor.length - 1;

    // 4. ПЕРЕКЛЮЧЕНИЕ ИНТЕРФЕЙСА
    if(typeof viewMode !== 'undefined') {
        // Принудительно ставим одиночный режим
        viewMode = 'single'; 
        activeCakeId = targetId; 
        
        // --- ОБНОВЛЕНИЕ КНОПОК (ИСПРАВЛЕНО) ---
        const allBtns = document.querySelectorAll('button, .tab-btn, .cake-toggle');
        const targetChar = (targetId === 0) ? 'A' : 'B';

        allBtns.forEach(btn => {
            const txt = btn.innerText || '';
            const onclickAttrs = btn.getAttribute('onclick') || '';
            
            // Работаем только с кнопками переключения тортов
            if (txt.includes('Торт') || onclickAttrs.includes('Cake')) {
                
                // 1. Сначала выключаем ВСЁ
                btn.classList.remove('active');
                
                // 2. Включаем только ТУ САМУЮ кнопку
                // Условие:
                // а) Текст содержит нужную букву (A или B) ИЛИ функция вызывает нужный ID (0 или 1)
                // б) НО текст НЕ содержит "+" (чтобы не зажечь A+B)
                const isTarget = (txt.includes(targetChar) || onclickAttrs.includes(`(${targetId})`));
                const isDual = txt.includes('+') || txt.includes('A+B'); // Кнопка "Оба"

                if (isTarget && !isDual) {
                    btn.classList.add('active');
                }
            }
        });
    }
    
    // 5. Устанавливаем выделение
    ui.selTier = targetTierIdx;
    ui.selDecorIdx = newDecorIdx;
    
    // 6. Обновляем сцену и меню
    rebuildScene();
    setTimeout(() => {
        openMenu('decor');
    }, 0);
}

/* --- ФУНКЦИЯ ЭКСПОРТА В AR --- */
/* --- ФИНАЛЬНАЯ ФУНКЦИЯ ЭКСПОРТА (С Именем и Выбором) --- */
async function exportAR(format) {
    // 1. ПОЛУЧАЕМ ИМЯ ИЗ ИНПУТА
    const nameInput = document.getElementById('export-name');
    let fileName = nameInput ? nameInput.value : 'cake_ar';
    // Убираем расширение, если пользователь его случайно написал
    fileName = fileName.replace(/\.(glb|usdz)$/i, '');
    if (!fileName) fileName = 'cake_ar';

    // 2. ИЩЕМ НУЖНЫЙ ТОРТ
    // 2. ИЩЕМ ОБЪЕКТ(Ы) ТОРТА
    let sourceObj;
    if (viewMode === 'single') {
        // Если выбран один торт — берем только его
        sourceObj = group.children[activeCakeId === 0 ? 0 : (group.children.length > 1 ? 1 : 0)];
    } else {
        // Если выбран режим A+B — экспортируем всю группу целиком
        sourceObj = group;
    }
    
    if (!sourceObj || (sourceObj.children && sourceObj.children.length === 0)) { 
        alert('Ошибка: Торт не найден'); return; 
    }

    // 3. ПОДГОТОВКА (Клонирование)
    const objectToExport = sourceObj.clone();
    
    // ВАЖНО: Если мы экспортируем ОБА торта (viewMode === 'both'), 
    // нам НЕ НУЖНО делать objectToExport.position.set(0, 0, 0), 
    // иначе они встанут друг в друга. Смещение (-220 и +220) должно сохраниться.
    if (viewMode === 'single') {
        objectToExport.position.set(0, 0, 0);
    }
    
      
    // 4. ОЧИСТКА (Удаляем вспомогательные элементы)
    const toRemove = [];
    objectToExport.traverse((child) => {
        // Удаляем обводку выделения
        if (child.isLineSegments || child.type === 'LineSegments' || child.type === 'Line') {
            toRemove.push(child);
        }
        // Удаляем плашки с размерами (они плохо выглядят в AR)
        if (child.userData && child.userData.type === 'infoLabel') {
            toRemove.push(child);
        }
    });
    // Физическое удаление найденного мусора
    toRemove.forEach(child => child.parent.remove(child));

    // 5. МАСШТАБИРОВАНИЕ
    // 1 unit Three.js = 1 метр AR.
    // Торт 200мм = 0.2 метра. Уменьшаем в 1000 раз.
    objectToExport.scale.set(0.001, 0.001, 0.001);
    objectToExport.updateMatrixWorld();

    // 6. ЭКСПОРТ В НУЖНЫЙ ФОРМАТ
    if (format === 'usdz') {
        // --- iPhone / iPad (.usdz) ---
        try {
            const exporter = new THREE.USDZExporter();
            const arraybuffer = await exporter.parse(objectToExport);
            const blob = new Blob([arraybuffer], { type: 'application/octet-stream' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName + '.usdz';
            link.click();
        } catch (e) {
            alert('Ошибка экспорта USDZ. Проверьте консоль.');
            console.error(e);
        }
        
    } else {
        // --- Android / Web (.glb) ---
        try {
            const exporter = new THREE.GLTFExporter();
            exporter.parse(
                objectToExport,
                function (gltf) {
                    const blob = new Blob([gltf], { type: 'application/octet-stream' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = fileName + '.glb';
                    link.click();
                },
                { binary: true } // Обязательно binary для GLB
            );
        } catch (e) {
            alert('Ошибка экспорта GLB.');
            console.error(e);
        }
    }
}

    }
    
    openMenu('decor'); 
    recordHistory();
}
/* --- ЛОГИКА ЛИНЕЙКИ --- */
let rulerMode = false;
let rulerStep = 0; // 0: ждем первую точку, 1: ждем вторую
let rulerStart = new THREE.Vector3();
let rulerMarkerA, rulerMarkerB, rulerLine;

function toggleRuler() {
    rulerMode = !rulerMode;
    const btn = document.getElementById('btn-ruler');
    const label = document.getElementById('measure-label');
    
    // Сбрасываем текущий замер при переключении
    clearRulerVisuals();
    rulerStep = 0;
    label.style.display = 'none';

    if (rulerMode) {
        btn.classList.add('active-tool');
        // Закрываем меню, чтобы не мешало
        closeSheet();
        ui.selDecorIdx = null; // Снимаем выделение с объектов
        rebuildScene(); // Убираем рамки выделения
        alert('Режим линейки:\n1. Нажмите первую точку.\n2. Нажмите вторую точку.\n(Чтобы выйти, нажмите иконку линейки еще раз)');
    } else {
        btn.classList.remove('active-tool');
    }
}

function clearRulerVisuals() {
    if (rulerMarkerA) { scene.remove(rulerMarkerA); rulerMarkerA = null; }
    if (rulerMarkerB) { scene.remove(rulerMarkerB); rulerMarkerB = null; }
    if (rulerLine) { scene.remove(rulerLine); rulerLine = null; }
    document.getElementById('measure-label').style.display = 'none';
    renderer.render(scene, camera);
}

function createDot(pos, color) {
    const geo = new THREE.SphereGeometry(2, 16, 16); // Маленькая точка 2мм
    const mat = new THREE.MeshBasicMaterial({ color: color, depthTest: false }); // depthTest: false чтобы было видно поверх всего
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);
    mesh.renderOrder = 999; // Рисуем поверх
    scene.add(mesh);
    return mesh;
}

function drawLine(p1, p2) {
    const mat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2, depthTest: false });
    const points = [p1, p2];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(geo, mat);
    line.renderOrder = 999;
    scene.add(line);
    return line;
}

// Функция обновления позиции наклейки (вызывается при вращении камеры)
function updateMeasureLabel() {
    if (!rulerMarkerA || !rulerMarkerB) return;
    
    // Находим середину линии
    const midPoint = new THREE.Vector3().addVectors(rulerMarkerA.position, rulerMarkerB.position).multiplyScalar(0.5);
    
    // Проецируем 3D точку в 2D координаты экрана
    midPoint.project(camera);
    
    const x = (midPoint.x * .5 + .5) * window.innerWidth;
    const y = (-(midPoint.y * .5) + .5) * window.innerHeight;
    
    const label = document.getElementById('measure-label');
    label.style.left = x + 'px';
    label.style.top = y + 'px';
    
}

/* --- ЛОГИКА МУЛЬТИ-ВЫБОРА --- */
function toggleMultiSelectMode() {
    isMultiSelect = !isMultiSelect;
    selectedDecors = []; // Сбрасываем выбор при переключении
    if (!isMultiSelect) {
        ui.selDecorIdx = null; // Сбрасываем и обычное выделение
    }
    openMenu('decor');
    rebuildScene();
}

function toggleDecorSelection(index) {
    const pos = selectedDecors.indexOf(index);
    if (pos === -1) {
        selectedDecors.push(index);
    } else {
        selectedDecors.splice(pos, 1);
    }
    rebuildScene();
    
    // ВАЖНО: Передаем index вторым аргументом, чтобы меню знало, кого держать в поле зрения
    openMenu('decor', index); 
}

function groupAction(action) {
    if (ui.selTier === null || selectedDecors.length === 0) return;
    const tier = getActiveTiers()[ui.selTier];
    
    // Сортируем индексы в обратном порядке для корректного удаления
    const sortedIndices = [...selectedDecors].sort((a,b) => b-a);

    sortedIndices.forEach(idx => {
        const d = tier.decor[idx];
        if (action === 'lock') d.locked = true;
        if (action === 'unlock') d.locked = false;
        if (action === 'delete') {
            tier.decor.splice(idx, 1);
        }
    });

    if (action === 'delete') {
        selectedDecors = []; // Сбрасываем выбор после удаления
    }

    rebuildScene();
    openMenu('decor');
    recordHistory();
}
/* --- ФУНКЦИЯ СОЗДАНИЯ СИММЕТРИИ --- */
function makeSymmetry(count) {
    if (ui.selTier === null || ui.selDecorIdx === null) {
        alert("Выберите элемент декора!"); 
        return;
    }

    const tier = getActiveTiers()[ui.selTier];
    const source = tier.decor[ui.selDecorIdx];

    // Генерируем уникальный ID для этой группы симметрии
    const symId = Date.now() + '_' + Math.random();
    
    // Присваиваем ID исходному объекту
    source.symId = symId;

    // Создаем копии
    for (let i = 1; i < count; i++) {
        // Клонируем данные
        const clone = JSON.parse(JSON.stringify(source));
        
        // Считаем смещение для копии
        // Для стикеров (side) x — это прогресс 0..1 по окружности
        if (source.placement === 'side') {
            clone.x = (source.x + (i / count)) % 1; 
        } 
        // Для 3D объектов (topper, volume) нужно вращать координаты вокруг центра
        else {
            // Для простоты пока просто дублируем, пользователь сам растащит? 
            // Нет, надо расставить красиво сразу.
            // Но у нас координаты x, z линейные. Сложно рассчитать без полярных координат.
            // ДЛЯ SIDE (Стикеры) это работает идеально сразу.
            // ДЛЯ 3D объектов (ягоды наверху) сделаем упрощенно: 
            // Это работает, если объект стоит не в центре (0,0).
            
            // Если это объект на крышке, используем "вращение вектора"
            const angle = (i / count) * Math.PI * 2;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            
            const x0 = source.x || 0;
            const z0 = source.z || 0;
            
            // Поворот точки (x0, z0) на угол angle
            clone.x = x0 * cos - z0 * sin;
            clone.z = x0 * sin + z0 * cos;
            
            // Поворот самого объекта тоже нужен!
            clone.rot = (source.rot || 0) - (angle * 180 / Math.PI); 
        }
        
        clone.symId = symId; // Связываем с "мамой"
        tier.decor.push(clone);
    }

    rebuildScene();
    openMenu('decor'); // Обновляем список слоев
    recordHistory();
    
    alert(`Создана симметрия x${count}! Теперь двигайте любой элемент из группы.`);
}
/* --- ФУНКЦИЯ УПРАВЛЕНИЯ НАПРАВЛЯЮЩИМИ --- */
function updateSnapLines(visibleX, visibleZ, pos) {
    // 1. Создаем линии, если их нет
    if (!snapLines.x) {
        const mat = new THREE.LineBasicMaterial({ color: 0xff0000, transparent:true, opacity:0.6 }); // Красная вертикаль
        const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -1000, 0), new THREE.Vector3(0, 1000, 0)]);
        snapLines.x = new THREE.Line(geo, mat);
        scene.add(snapLines.x);
    }
    if (!snapLines.z) {
        const mat = new THREE.LineBasicMaterial({ color: 0x0000ff, transparent:true, opacity:0.6 }); // Синяя горизонталь
        const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1000, 0, 0), new THREE.Vector3(1000, 0, 0)]);
        snapLines.z = new THREE.Line(geo, mat);
        scene.add(snapLines.z);
    }

    // 2. Показываем/Скрываем и двигаем X (Вертикальная линия)
    // Она показывает центр по X (красная линия вдоль Y)
    if (visibleX) {
        snapLines.x.visible = true;
        snapLines.x.position.set(pos.x, 0, pos.z); // Ставим линию в точку объекта
        // Но для центра X нам нужна линия, проходящая через X=0.
        // Поэтому для "Центра" мы жестко ставим её в 0.
        // Если вы хотите прилипать к краям, логика будет сложнее. Пока делаем ЦЕНТР.
        snapLines.x.position.set(0, 0, 0); 
    } else {
        snapLines.x.visible = false;
    }

    // 3. Показываем/Скрываем Z (Линия глубины)
    if (visibleZ) {
        snapLines.z.visible = true;
        snapLines.z.position.set(0, pos.y, 0); // Уровень высоты? Нет, центр стола.
        snapLines.z.position.set(0, 0, 0);
        snapLines.z.rotation.y = Math.PI / 2; // Поворачиваем поперек
    } else {
        snapLines.z.visible = false;
    }
}

/* --- ИСПРАВЛЕННАЯ ЛОГИКА DRAG (УНИВЕРСАЛЬНАЯ) --- */
const sheetEl = document.getElementById('bottom-sheet');
const dragEl = document.getElementById('sheet-drag-handle');
let dragStartY, dragStartH, isSheetDragging = false;

// Используем pointerdown вместо touchstart (работает и мышь, и палец)
dragEl.addEventListener('pointerdown', (e) => {
    // 1. Блокируем всплытие, чтобы не вращалась камера
    e.stopPropagation(); 
    
    isSheetDragging = true;
    dragStartY = e.clientY; // Координата Y нажатия
    dragStartH = sheetEl.getBoundingClientRect().height; // Текущая высота
    
    sheetEl.style.transition = 'none'; // Отключаем плавность для мгновенного отклика
    
    // 2. "Захват" курсора. События будут идти на этот элемент, даже если палец ушел в сторону
    dragEl.setPointerCapture(e.pointerId);
});

dragEl.addEventListener('pointermove', (e) => {
    if (!isSheetDragging) return;
    
    // 3. Считаем разницу (тянем вверх = Y уменьшается, значит разница положительная для высоты)
    const delta = dragStartY - e.clientY; 
    const newH = dragStartH + delta;
    
    // 4. Ограничители высоты (в пикселях)
    const maxH = window.innerHeight * 0.95; // Не больше 95% экрана
    const minH = window.innerHeight * 0.15; // Не меньше 15% экрана
    
    if(newH > maxH || newH < minH) return;
    
    sheetEl.style.height = newH + 'px';
});

// Завершение перетаскивания
const stopDrag = (e) => {
    if (!isSheetDragging) return;
    isSheetDragging = false;
    // Возвращаем плавную анимацию
    sheetEl.style.transition = 'height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)'; 
    dragEl.releasePointerCapture(e.pointerId);
};

dragEl.addEventListener('pointerup', stopDrag);
dragEl.addEventListener('pointercancel', stopDrag);
init();
